from_latest_tag = true
tag_prefix = ""
branch_whitelist = ["main"]
ignore_merge_commits = true

# The crate version follows the tag; cargo check updates Cargo.lock to match.
# cog adds both files to the bump commit.
pre_bump_hooks = [
  "sed -i '0,/^version = /s/^version = .*/version = \"{{version}}\"/' Cargo.toml",
  "cargo check --quiet",
]

post_bump_hooks = ["git push origin {{version}}", "git push"]

[bump_profiles]

[commit_types]
chore = { changelog_title = "Misc", omit_from_changelog = true }
hotfix = { changelog_title = "Hotfixes" }
release = { changelog_title = "Releases" }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "tbloom"
owner = "sravioli"
authors = [{ signature = "Simone Fidanza", username = "sravioli" }]
