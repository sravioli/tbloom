---
name: packages
run-name: Build release packages

# Builds tbloom for each platform and uploads the archives (plus SHA-256 sums) to the
# release. Runs when a release is published by hand, and from release.yaml after it
# creates one.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        # cross-built binaries (x86_64 macOS on an arm runner) cannot run here
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --locked --target "$TARGET"
        shell: bash

      - name: Build
        run: cargo build --release --locked --target "$TARGET"
        shell: bash

      - name: Package
        shell: bash
        run: |
          name="tbloom-$TAG-$TARGET"
          mkdir "$name"
          exe=tbloom
          [ "$RUNNER_OS" = Windows ] && exe=tbloom.exe
          cp "target/$TARGET/release/$exe" README.md LICENSE LICENSE-DOCS "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$name.zip"
            7z a -bso0 "$archive" "$name"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber --repo "$GITHUB_REPOSITORY"
